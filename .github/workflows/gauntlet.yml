name: Mutation policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust:
    name: gauntlet-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo-repo/package-lock.json
      - name: Detect changed demo source
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-5b4762e}"
          if git diff --quiet "$base" HEAD -- demo-repo/src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.changed == 'true'
        run: npm ci --prefix demo-repo
      - if: steps.scope.outputs.changed == 'true'
        run: go install ./cmd/gauntlet
      - if: steps.scope.outputs.changed == 'true'
        run: gauntlet --repo demo-repo init
      - name: Mutate changed demo source
        if: steps.scope.outputs.changed == 'true'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-5b4762e}"
          gauntlet --repo demo-repo run --changed --base-ref "$base" --test-command "npm run test:strong" --trigger ci
      - name: Enforce minimum test strength
        if: steps.scope.outputs.changed == 'true'
        run: gauntlet --repo demo-repo gate --min-score 95
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.changed == 'true'
        with:
          name: gauntlet-run
          path: demo-repo/.gauntlet/runs/
          include-hidden-files: true
